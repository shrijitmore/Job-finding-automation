name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jfa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jfa_test
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jfa_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Create worker test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "create database jfa_test_worker"
      - name: Install Playwright browsers
        run: pnpm --filter @jfa/web exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm test:e2e
      - name: Boot production bundles
        # Catches dependencies that only exist in dev installs (devDependencies are dropped by --prod).
        run: |
          pnpm --filter @jfa/api deploy --prod /tmp/api-prod
          pnpm --filter @jfa/worker deploy --prod /tmp/worker-prod
          export DATABASE_URL=postgres://postgres:postgres@localhost:5432/jfa_test ENCRYPTION_KEY=ci-encryption-key-1234567890
          (cd /tmp/api-prod && PORT=4900 JWT_SECRET=ci-jwt-secret-1234567890 node dist/main.js > /tmp/api.log 2>&1 &)
          (cd /tmp/worker-prod && HEALTH_PORT=4901 MIGRATE_ON_START=false node dist/main.js > /tmp/worker.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:4900/api/health && curl -sf localhost:4901 && exit 0; sleep 2; done
          cat /tmp/api.log /tmp/worker.log; exit 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        image: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
